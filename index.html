<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Planner</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2421;--mute:#6b7772;--line:#e1e5e0;--accent:#1f6f5c;--accent2:#e8f3ef;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--card:#1c2220;--ink:#e8eeea;--mute:#8fa09a;--line:#2d3633;--accent:#4fb89c;--accent2:#1f3430;--warn:#e08a4f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
h1{font-size:17px;margin:0}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.tabs button{border:0;background:none;color:var(--mute);padding:6px 12px;border-radius:8px;font:inherit;font-weight:600}
.tabs button.on{background:var(--accent);color:#fff}
button{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--warn)}
#title{font-weight:700;font-size:16px;min-width:140px;text-align:center}
main{padding:12px;max-width:1200px;margin:0 auto}
.banner{background:var(--accent2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.banner.warn{border-color:var(--warn)}
.dlrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:stretch}
.dow{font-size:12px;font-weight:700;color:var(--mute);text-align:center;padding:2px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:84px;padding:4px;cursor:pointer;overflow-wrap:anywhere;word-break:break-word}
.cell.out{opacity:.45}
.cell.today{border:2px solid var(--accent)}
.cell .n{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:2px}
.ptag{font-size:10px;font-weight:600;background:var(--accent2);color:var(--accent);border-radius:4px;padding:0 3px}
.chip{display:block;font-size:11px;border-radius:4px;padding:2px 4px;margin-top:2px;color:#fff;line-height:1.25}
.emos{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;font-size:16px;line-height:1.1}
.emo.dn,.chip.dn,.ev.dn{opacity:.55;text-decoration:line-through}
.cnt{font-size:11px;color:var(--mute);margin-top:2px}
.mtd{font-size:11px;color:var(--ink);margin-top:2px;line-height:1.25}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;overflow-wrap:anywhere}
.card.today{border:2px solid var(--accent)}
.card h3{margin:0 0 6px;font-size:14px;cursor:pointer}
.ev{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:5px 7px;border-radius:6px;margin:3px 0;color:#fff;font-size:13px;cursor:pointer}
.ev small{opacity:.9}
.ev span{min-width:0;word-break:break-word}
.ev input{width:16px;height:16px;accent-color:#fff}
.todo{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.todo.done span{text-decoration:line-through;color:var(--mute)}
.todo input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.todo .x{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer}
.add{width:100%;border:1px dashed var(--line);background:none;border-radius:6px;padding:6px;margin-top:4px;color:var(--ink);font:inherit}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;padding:8px;resize:vertical}
.sec{margin-top:14px}
.sec>h2{font-size:14px;margin:0 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.pline{font-size:13px;background:var(--accent2);border-radius:6px;padding:4px 8px;margin:3px 0}
.pwk{border-top:1px solid var(--line);padding:8px 0}
.pwk.now{background:var(--accent2);border-radius:8px;padding:8px}
.pwk textarea{min-height:56px;margin-top:6px}
.pwk small{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:16px;max-height:92vh;overflow:auto}
dialog::backdrop{background:#0006}
label{display:block;font-size:12px;color:var(--mute);margin-top:10px}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.emrow{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.emrow button{font-size:20px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 6px;cursor:pointer}
.emrow button.on{border-color:var(--accent);background:var(--accent2)}
@media (max-width:760px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cell{min-height:64px;padding:3px}.chip{font-size:10px;padding:1px 3px}#title{min-width:0;font-size:14px}.tabs button{padding:6px 9px;font-size:14px}.mtd{font-size:10px}.ev{font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 class="grow">My Planner</h1>
    <button class="btn" data-a="menu">Backup</button>
  </div>
  <div class="row" style="margin-top:6px">
    <div class="tabs" id="tabs">
      <button data-a="view" data-v="month">Month</button>
      <button data-a="view" data-v="week">Week</button>
      <button data-a="view" data-v="day">Day</button>
      <button data-a="view" data-v="projects">Projects</button>
    </div>
    <span class="grow"></span>
    <button class="btn" data-a="prev">&lsaquo;</button>
    <div id="title"></div>
    <button class="btn" data-a="next">&rsaquo;</button>
    <button class="btn" data-a="today">Today</button>
  </div>
</header>
<main id="app"></main>

<dialog id="evDlg">
  <form method="dialog" id="evForm">
    <b id="evHead">Event</b>
    <label>Type</label>
    <select id="evKind"><option value="event">Event</option><option value="deadline">Deadline (reminds from 3 days before)</option></select>
    <label>Emoji tag (tap one, or type your own)</label>
    <div class="emrow" id="emRow"></div>
    <input type="text" id="evEmoji" placeholder="Emoji (optional)" maxlength="8">
    <label>Title (optional if you picked an emoji)</label><input type="text" id="evTitle">
    <label>Date</label><input type="date" id="evDate" required>
    <div class="two">
      <div><label>Start / due time</label><input type="time" id="evStart"></div>
      <div id="endWrap"><label>End</label><input type="time" id="evEnd"></div>
    </div>
    <div class="two">
      <div><label>Colour category</label><select id="evCat"></select></div>
      <div id="remWrap"><label>Reminder</label>
        <select id="evRem"><option value="">None</option><option value="0">At start</option><option value="10">10 min before</option><option value="30">30 min before</option><option value="60">1 hour before</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button type="button" class="btn del" id="evDel">Delete</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="evCancel">Cancel</button>
      <button class="btn pri">Save</button>
    </div>
  </form>
</dialog>

<dialog id="pjDlg">
  <form method="dialog" id="pjForm">
    <b id="pjHead">Project</b>
    <label>Project name</label><input type="text" id="pjName" required>
    <label>Emoji (optional)</label><input type="text" id="pjEmoji" placeholder="📘" maxlength="8">
    <label>Day 1 (start date)</label><input type="date" id="pjStart" required>
    <div class="two">
      <div><label>Length</label><input type="number" id="pjN" min="1" max="520" value="12" required></div>
      <div><label>Unit</label><select id="pjUnit"><option value="weeks">Weeks</option><option value="months">Months</option></select></div>
    </div>
    <p style="font-size:12px;color:var(--mute)">Weeks are numbered automatically from day 1 (Week 1 = days 1–7, Week 2 = days 8–14, and so on).</p>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn del" id="pjDel">Delete</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="pjCancel">Cancel</button>
      <button class="btn pri">Save</button>
    </div>
  </form>
</dialog>

<dialog id="bkDlg">
  <b>Backup &amp; settings</b>
  <p id="bkInfo" style="color:var(--mute);font-size:13px"></p>
  <div class="row">
    <button class="btn pri" data-a="export">Download backup</button>
    <button class="btn" data-a="import">Restore from file</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn" data-a="notif">Enable reminders</button>
  </div>
  <p style="color:var(--mute);font-size:12px">Your data is stored on this device. Download a backup regularly until cloud sync is added.</p>
  <div class="row"><span class="grow"></span><button class="btn" data-a="closeBk">Close</button></div>
  <input type="file" id="file" accept="application/json" hidden>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtShort=d=>`${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`;
const CATS={General:'#1f6f5c',Study:'#3b6fb6',Exam:'#b4531a',Work:'#7a4fb0',Personal:'#b0457a'};
const EMOJIS=['📚','📝','🎯','⏰','🧾','📊','💰','💼','🎥','✅','⚠️','🔥','📞','🏥','🛒','✈️','🎂','🏋️','🙏','🏠','📅','💡','📌','☕'];

const KEY='planner.v1';
function fresh(){return{v:2,events:[],todos:[],notes:{},projects:[],pw:{},meta:{}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.events?Object.assign(fresh(),x):fresh()}catch(e){return fresh()}}
let db=load();
if(!db.meta)db.meta={};
function save(){db.meta.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save: storage full or blocked.')}}
const getNote=k=>db.notes[k]||'';
const setNote=(k,v)=>{if(v)db.notes[k]=v;else delete db.notes[k];save()};

let view=localStorage.getItem('planner.view')||'month';
if(!['month','week','day','projects'].includes(view))view='month';
let cur=new Date();cur.setHours(0,0,0,0);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

const isDl=e=>e.kind==='deadline';
const label=e=>(((e.emoji?e.emoji+' ':'')+(e.title||'')).trim())||'(untitled)';
const evsOn=d=>db.events.filter(e=>e.date===d).sort((a,b)=>(isDl(b)-isDl(a))||(a.start||'').localeCompare(b.start||''));
const todosOn=d=>db.todos.filter(t=>t.date===d).sort((a,b)=>a.done-b.done);

/* ---------- projects ---------- */
function projEnd(p){const s=parse(p.start);return p.unit==='months'?new Date(s.getFullYear(),s.getMonth()+Number(p.n),s.getDate()):addDays(s,7*Number(p.n))}
function projWeeks(p){return Math.max(1,Math.ceil((projEnd(p)-parse(p.start))/(7*864e5)))}
function projWeekOf(p,k){
  const d=daysBetween(p.start,k);
  if(d<0||parse(k)>=projEnd(p))return null;
  return{w:Math.floor(d/7)+1,day:d%7+1,total:projWeeks(p)};
}
function weekRange(p,w){
  const from=addDays(parse(p.start),7*(w-1));
  const last=addDays(projEnd(p),-1);
  let to=addDays(from,6);if(to>last)to=last;
  return[from,to];
}
function projLinesForDays(a,b){
  let h='';
  db.projects.forEach(p=>{
    const A=projWeekOf(p,a),B=projWeekOf(p,b);
    if(!A&&!B)return;
    const x=A||B,total=x.total;
    const wk=(A&&B&&A.w!==B.w)?`Week ${A.w} → ${B.w}`:`Week ${x.w}`;
    h+=`<div class="pline">${esc(p.emoji||'📘')} ${esc(p.name)} · ${wk} of ${total}</div>`;
  });
  return h;
}

/* ---------- html pieces ---------- */
function evHtml(e){
  const dl=isDl(e),col=dl?'var(--warn)':(CATS[e.cat]||CATS.General);
  const t=e.start?`<small>${e.start}${(!dl&&e.end)?'–'+e.end:''}</small>`:'';
  const chk=dl?`<input type="checkbox" ${e.done?'checked':''} data-a="dlDone" data-id="${e.id}" aria-label="Done">`:'';
  return `<div class="ev ${dl&&e.done?'dn':''}" style="background:${col}" data-a="editEv" data-id="${e.id}">${chk}${(dl&&!e.emoji)?'🎯 ':''}${t}<span>${esc(label(e))}</span>${(!dl&&e.rem!==''&&e.rem!=null)?' 🔔':''}</div>`;
}
function chipHtml(e,mode){
  const dl=isDl(e),done=dl&&e.done;
  if(mode==='emoji')return `<span class="emo ${done?'dn':''}" title="${esc(label(e))}">${esc(e.emoji||(dl?'🎯':'•'))}</span>`;
  return `<span class="chip ${done?'dn':''}" style="background:${dl?'var(--warn)':(CATS[e.cat]||CATS.General)}">${(dl&&!e.emoji)?'🎯 ':''}${esc(label(e))}</span>`;
}
function todoHtml(t){
  return `<div class="todo ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} data-a="tog" data-id="${t.id}"><span>${esc(t.text)}</span><button class="x" data-a="delTodo" data-id="${t.id}" aria-label="Delete">✕</button></div>`;
}
function todoBlock(d){
  return todosOn(d).map(todoHtml).join('')+`<input class="add" data-add="${d}" placeholder="+ add to-do, press Enter">`;
}
function noteBox(k,ph){return `<textarea data-note="${k}" placeholder="${ph}">${esc(getNote(k))}</textarea>`}

/* ---------- views ---------- */
function renderMonth(){
  const y=cur.getFullYear(),m=cur.getMonth(),mode=localStorage.getItem('planner.mmode')||'full';
  $('#title').textContent=`${MON[m]} ${y}`;
  const start=monday(new Date(y,m,1)),t=ds(today());
  let h=`<div class="row" style="margin-bottom:8px"><button class="btn" data-a="mmode">${mode==='full'?'Show emoji only':'Show full text'}</button><small style="color:var(--mute)">Boxes grow to fit everything. Tap a day to open it.</small></div>`;
  h+='<div class="mgrid">'+DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i),k=ds(d);
    if(i>=35&&d.getMonth()!==m)break;
    const items=evsOn(k),td=todosOn(k),open=td.filter(x=>!x.done);
    let tags='';
    db.projects.forEach(p=>{const pw=projWeekOf(p,k);if(pw&&pw.day===1)tags+=`<span class="ptag">${esc(p.emoji||'📘')}W${pw.w}</span>`});
    let body=items.map(e=>chipHtml(e,mode)).join('');
    if(mode==='emoji')body=`<div class="emos">${body}</div>`;
    if(td.length){
      body+=mode==='full'
        ?open.map(x=>`<div class="mtd">☐ ${esc(x.text)}</div>`).join('')+(td.length-open.length?`<div class="cnt">✔ ${td.length-open.length} done</div>`:'')
        :`<div class="cnt">☑ ${open.length}</div>`;
    }
    h+=`<div class="cell ${d.getMonth()!==m?'out':''} ${k===t?'today':''}" data-a="goDay" data-d="${k}"><div class="n"><span>${d.getDate()}</span>${tags}</div>${body}</div>`;
  }
  h+='</div>';
  h+=`<div class="sec"><h2>Month goals &amp; notes</h2>${noteBox('m:'+y+'-'+pad(m+1),'Goals, deadlines, things to remember this month…')}</div>`;
  return h;
}
function renderWeek(){
  const s=monday(cur),e=addDays(s,6),t=ds(today());
  $('#title').textContent=`${s.getDate()} ${MON[s.getMonth()].slice(0,3)} – ${e.getDate()} ${MON[e.getMonth()].slice(0,3)} ${e.getFullYear()}`;
  let h='<div class="wgrid">';
  for(let i=0;i<7;i++){
    const d=addDays(s,i),k=ds(d);
    h+=`<div class="card ${k===t?'today':''}"><h3 data-a="goDay" data-d="${k}">${DOW[i]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}</h3>`+
      evsOn(k).map(evHtml).join('')+
      `<button class="add" data-a="newEv" data-d="${k}">+ event / deadline</button><div style="margin-top:8px">${todoBlock(k)}</div></div>`;
  }
  h+=`<div class="card"><h3 style="cursor:default">Week plan</h3>${projLinesForDays(ds(s),ds(e))}${noteBox('w:'+ds(s),'Priorities and notes for this week…')}</div>`;
  h+='</div>';
  return h;
}
function renderDay(){
  const k=ds(cur);
  $('#title').textContent=`${DOW[(cur.getDay()+6)%7]}, ${cur.getDate()} ${MON[cur.getMonth()].slice(0,3)} ${cur.getFullYear()}`;
  const prev=ds(addDays(cur,-1));
  const carry=todosOn(prev).filter(t=>!t.done).length;
  let h='';
  const pl=projLinesForDays(k,k);
  if(pl)h+=`<div class="card" style="margin-bottom:10px">${db.projects.map(p=>{const w=projWeekOf(p,k);return w?`<div class="pline">${esc(p.emoji||'📘')} ${esc(p.name)} · Week ${w.w} of ${w.total} · Day ${w.day}</div>`:''}).join('')}</div>`;
  h+=`<div class="card"><div class="row"><b class="grow">Schedule &amp; deadlines</b><button class="btn pri" data-a="newEv" data-d="${k}">+ Add</button></div>`+
    (evsOn(k).map(evHtml).join('')||'<p style="color:var(--mute)">Nothing scheduled.</p>')+`</div>`;
  h+=`<div class="card sec"><div class="row"><b class="grow">To-do</b>${carry?`<button class="btn" data-a="carry">Carry over ${carry} from yesterday</button>`:''}</div>${todoBlock(k)}</div>`;
  h+=`<div class="sec"><h2>Day notes</h2>${noteBox('d:'+k,'Notes, study log, thoughts for today…')}</div>`;
  return h;
}
function renderProjects(){
  $('#title').textContent='Projects';
  const t=ds(today());
  let h=`<div class="row"><button class="btn pri" data-a="newProj">+ New project</button></div>`;
  if(!db.projects.length)h+=`<p style="color:var(--mute)">Add a project with a start date and a length in weeks or months. Weeks are named and numbered automatically from day 1.</p>`;
  db.projects.forEach(p=>{
    const tot=projWeeks(p);
    h+=`<div class="card sec"><div class="row"><b class="grow">${esc(p.emoji||'📘')} ${esc(p.name)}</b><small style="color:var(--mute)">${fmtShort(parse(p.start))} → ${fmtShort(addDays(projEnd(p),-1))} · ${tot} weeks</small><button class="btn" data-a="editProj" data-id="${p.id}">Edit</button></div>`;
    for(let w=1;w<=tot;w++){
      const [a,b]=weekRange(p,w),now=t>=ds(a)&&t<=ds(b),key=p.id+':'+w;
      h+=`<div class="pwk ${now?'now':''}"><div class="row"><input type="checkbox" data-a="pwDone" data-key="${key}" ${db.pw[key]?'checked':''}><b>Week ${w}</b><small>${fmtShort(a)} – ${fmtShort(b)}${now?' · this week':''}</small></div><textarea data-note="p:${key}" placeholder="Goals / tasks / notes for week ${w}…">${esc(getNote('p:'+key))}</textarea></div>`;
    }
    h+='</div>';
  });
  return h;
}
function deadlineBanner(){
  const t=ds(today());
  const list=db.events.filter(e=>isDl(e)&&!e.done&&daysBetween(t,e.date)<=3).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length)return '';
  return `<div class="banner warn"><b>Deadlines due within 3 days</b>`+list.map(e=>{
    const n=daysBetween(t,e.date);
    const when=n<0?`overdue by ${-n} day(s)`:n===0?'due today':n===1?'due tomorrow':`due in ${n} days`;
    return `<div class="dlrow"><span>${esc(label(e))} <small>— ${when} (${fmtShort(parse(e.date))})</small></span><button class="btn" data-a="dlDone" data-id="${e.id}" data-set="1">Done</button></div>`;
  }).join('')+`</div>`;
}
function backupBanner(){
  const lb=db.meta.lastBackup;
  const days=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(!db.events.length&&!db.todos.length&&!Object.keys(db.notes).length&&!db.projects.length)return '<div class="banner">Welcome. Tap a day to start, or use Backup → Restore if you have a saved file.</div>';
  if(days===null||days>=1)return `<div class="banner warn">${days===null?'No backup yet.':'Last backup '+days+' day(s) ago.'} Open <b>Backup</b> and download one.</div>`;
  return '';
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('[data-a=prev],[data-a=next],[data-a=today]').forEach(b=>b.style.display=view==='projects'?'none':'');
  let h=deadlineBanner()+backupBanner();
  h+=view==='month'?renderMonth():view==='week'?renderWeek():view==='day'?renderDay():renderProjects();
  $('#app').innerHTML=h;
}

/* ---------- event dialog ---------- */
const dlg=$('#evDlg');let editing=null;
$('#evCat').innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join('');
$('#emRow').innerHTML=EMOJIS.map(e=>`<button type="button" data-em="${e}">${e}</button>`).join('');
function markEm(){document.querySelectorAll('#emRow button').forEach(b=>b.classList.toggle('on',b.dataset.em===$('#evEmoji').value.trim()))}
function syncKind(){const dl=$('#evKind').value==='deadline';$('#remWrap').style.display=dl?'none':'';$('#endWrap').style.display=dl?'none':''}
$('#emRow').addEventListener('click',e=>{const b=e.target.closest('[data-em]');if(!b)return;const i=$('#evEmoji');i.value=(i.value.trim()===b.dataset.em)?'':b.dataset.em;markEm()});
$('#evEmoji').addEventListener('input',markEm);
$('#evKind').addEventListener('change',syncKind);
function openEv(id,date){
  editing=id?db.events.find(e=>e.id===id):null;
  $('#evHead').textContent=editing?'Edit':'New event or deadline';
  $('#evKind').value=editing?(editing.kind||'event'):'event';
  $('#evEmoji').value=editing?editing.emoji||'':'';
  $('#evTitle').value=editing?editing.title||'':'';
  $('#evDate').value=editing?editing.date:date;
  $('#evStart').value=editing?editing.start||'':'';
  $('#evEnd').value=editing?editing.end||'':'';
  $('#evCat').value=editing?editing.cat||'General':'General';
  $('#evRem').value=editing&&editing.rem!=null?editing.rem:'';
  $('#evDel').style.display=editing?'':'none';
  syncKind();markEm();
  dlg.showModal();
}
$('#evCancel').onclick=()=>dlg.close();
$('#evDel').onclick=()=>{if(editing&&confirm('Delete this?')){db.events=db.events.filter(e=>e.id!==editing.id);save();dlg.close();render()}};
$('#evForm').addEventListener('submit',ev=>{
  const kind=$('#evKind').value;
  const o={id:editing?editing.id:uid(),kind,emoji:$('#evEmoji').value.trim(),title:$('#evTitle').value.trim(),date:$('#evDate').value,start:$('#evStart').value,end:kind==='event'?$('#evEnd').value:'',cat:$('#evCat').value,rem:kind==='event'?$('#evRem').value:'',done:editing?!!editing.done:false};
  if(!o.title&&!o.emoji){ev.preventDefault();alert('Add a title or pick an emoji.');return}
  if(!o.date){ev.preventDefault();return}
  if(editing)Object.assign(editing,o);else db.events.push(o);
  save();render();checkReminders();
});

/* ---------- project dialog ---------- */
const pdlg=$('#pjDlg');let pEditing=null;
function openProj(id){
  pEditing=id?db.projects.find(p=>p.id===id):null;
  $('#pjHead').textContent=pEditing?'Edit project':'New project';
  $('#pjName').value=pEditing?pEditing.name:'';
  $('#pjEmoji').value=pEditing?pEditing.emoji||'':'';
  $('#pjStart').value=pEditing?pEditing.start:ds(today());
  $('#pjN').value=pEditing?pEditing.n:12;
  $('#pjUnit').value=pEditing?pEditing.unit:'weeks';
  $('#pjDel').style.display=pEditing?'':'none';
  pdlg.showModal();
}
$('#pjCancel').onclick=()=>pdlg.close();
$('#pjDel').onclick=()=>{
  if(!pEditing||!confirm('Delete this project and its weekly notes?'))return;
  const id=pEditing.id;
  db.projects=db.projects.filter(p=>p.id!==id);
  Object.keys(db.notes).forEach(k=>{if(k.startsWith('p:'+id+':'))delete db.notes[k]});
  Object.keys(db.pw).forEach(k=>{if(k.startsWith(id+':'))delete db.pw[k]});
  save();pdlg.close();render();
};
$('#pjForm').addEventListener('submit',ev=>{
  const o={id:pEditing?pEditing.id:uid(),name:$('#pjName').value.trim(),emoji:$('#pjEmoji').value.trim(),start:$('#pjStart').value,n:Number($('#pjN').value),unit:$('#pjUnit').value};
  if(!o.name||!o.start||!(o.n>=1)){ev.preventDefault();alert('Name, start date and length are needed.');return}
  if(pEditing)Object.assign(pEditing,o);else db.projects.push(o);
  save();render();
});

/* ---------- navigation, backup ---------- */
function go(n){
  if(view==='month')cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);
  else cur=addDays(cur,n*(view==='week'?7:1));
  render();
}
function exportData(){
  db.meta.lastBackup=Date.now();save();
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`planner-backup-${ds(new Date())}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  bkInfo();render();
}
function bkInfo(){
  const lb=db.meta.lastBackup;
  $('#bkInfo').textContent=`${db.events.length} events/deadlines, ${db.todos.length} to-dos, ${db.projects.length} projects, ${Object.keys(db.notes).length} notes. `+(lb?'Last backup: '+new Date(lb).toLocaleString():'No backup yet.');
}
$('#file').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{
    const x=JSON.parse(await f.text());
    if(!x||!Array.isArray(x.events)||!Array.isArray(x.todos))throw 0;
    if(!confirm('Replace everything on this device with the backup file?')){ev.target.value='';return}
    db=Object.assign(fresh(),x);db.meta=db.meta||{};save();render();bkInfo();
  }catch(e){alert('That file is not a valid planner backup.')}
  ev.target.value='';
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='view'){view=t.dataset.v;localStorage.setItem('planner.view',view);render()}
  else if(a==='prev')go(-1);else if(a==='next')go(1);
  else if(a==='today'){cur=today();render()}
  else if(a==='goDay'){cur=parse(t.dataset.d);view='day';localStorage.setItem('planner.view',view);render()}
  else if(a==='newEv')openEv(null,t.dataset.d);
  else if(a==='editEv')openEv(t.dataset.id);
  else if(a==='dlDone'){const x=db.events.find(z=>z.id===t.dataset.id);if(x){x.done=t.dataset.set?true:t.checked;save();render()}}
  else if(a==='mmode'){localStorage.setItem('planner.mmode',(localStorage.getItem('planner.mmode')||'full')==='full'?'emoji':'full');render()}
  else if(a==='newProj')openProj(null);
  else if(a==='editProj')openProj(t.dataset.id);
  else if(a==='pwDone'){if(t.checked)db.pw[t.dataset.key]=true;else delete db.pw[t.dataset.key];save()}
  else if(a==='tog'){const x=db.todos.find(z=>z.id===t.dataset.id);x.done=t.checked;save();render()}
  else if(a==='delTodo'){db.todos=db.todos.filter(z=>z.id!==t.dataset.id);save();render()}
  else if(a==='carry'){const p=ds(addDays(cur,-1)),k=ds(cur);db.todos.forEach(z=>{if(z.date===p&&!z.done)z.date=k});save();render()}
  else if(a==='menu'){bkInfo();$('#bkDlg').showModal()}
  else if(a==='closeBk')$('#bkDlg').close();
  else if(a==='export')exportData();
  else if(a==='import')$('#file').click();
  else if(a==='notif'){
    if(!('Notification' in window))alert('Notifications are not supported here.');
    else Notification.requestPermission().then(p=>{alert(p==='granted'?'Reminders on. They fire when you open the app; the deadline list at the top of the app always shows what is due in 3 days.':'Permission not granted.');checkReminders()});
  }
});
document.addEventListener('keydown',e=>{
  const i=e.target.closest&&e.target.closest('[data-add]');
  if(i&&e.key==='Enter'&&i.value.trim()){
    db.todos.push({id:uid(),date:i.dataset.add,text:i.value.trim(),done:false});save();render();
    const n=document.querySelector(`[data-add="${i.dataset.add}"]`);n&&n.focus();
  }
});
let nt;
document.addEventListener('input',e=>{
  const n=e.target.closest&&e.target.closest('[data-note]');
  if(n){clearTimeout(nt);nt=setTimeout(()=>setNote(n.dataset.note,n.value),400)}
});
window.addEventListener('pagehide',()=>{const n=document.activeElement;if(n&&n.dataset&&n.dataset.note)setNote(n.dataset.note,n.value)});

/* ---------- reminders ---------- */
let fired={};try{fired=JSON.parse(localStorage.getItem('planner.fired')||'{}')}catch(e){}
function markFired(key){
  fired[key]=1;
  const keys=Object.keys(fired);
  if(keys.length>400)keys.slice(0,200).forEach(k=>delete fired[k]);
  localStorage.setItem('planner.fired',JSON.stringify(fired));
}
function notify(title,body,tag){
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,tag})).catch(()=>{try{new Notification(title,{body})}catch(_){}});
  else{try{new Notification(title,{body})}catch(_){}}
}
function checkReminders(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now(),t0=ds(today());
  db.events.forEach(e=>{
    if(isDl(e)){
      if(e.done)return;
      const n=daysBetween(t0,e.date);
      if(n<0||n>3)return;
      const key='dl:'+e.id+'@'+t0;
      if(fired[key])return;
      markFired(key);
      notify('Deadline: '+label(e),n===0?'Due today':n===1?'Due tomorrow':`Due in ${n} days (${fmtShort(parse(e.date))})`,key);
      return;
    }
    if(!e.start||e.rem===''||e.rem==null)return;
    const at=parse(e.date);const [h,mi]=e.start.split(':').map(Number);at.setHours(h,mi,0,0);
    const when=at.getTime()-Number(e.rem)*60000;
    const key=e.id+'@'+when;
    if(now>=when&&now<when+10*60000&&!fired[key]){
      markFired(key);
      notify(label(e),`${e.start}${e.end?'–'+e.end:''}`,key);
    }
  });
}
setInterval(checkReminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkReminders()}});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();checkReminders();
</script>
</body>
